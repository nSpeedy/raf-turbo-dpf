# Edit `SITE_URL` to your production hostname before deploy.
# Both build arg and runtime env should match.
services:
  app:
    build:
      context: .
      args:
        SITE_URL: https://rafturbo.szafruga.dev
    container_name: raf-turbo-dpf-app
    ports:
      - "4323:4323"
    environment:
      - NODE_ENV=production
      - PORT=4323
      - HOST=0.0.0.0
      - SITE_URL=https://rafturbo.szafruga.dev
      # Astro 6 CSRF guard. Must match the public origin of the site.
      - ASTRO_ORIGIN=https://rafturbo.szafruga.dev
    restart: unless-stopped
